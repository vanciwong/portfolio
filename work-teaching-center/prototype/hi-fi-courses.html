<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>教学中心 · 我的课程（1920）· 单色高保真</title>
<style>
/* ===== 单色（灰度）色阶：改 --brand 系列即可切换为其他单色系 ===== */
:root{
  --brand:#2E2E2E; --brand-hover:#151515; --brand-click:#000000;
  --brand-10:rgba(0,0,0,.06); --brand-20:rgba(0,0,0,.13);
  --ink:#111111; --ink-2:#2B2B2B; --grey-60:#5C5C5C; --grey-50:#7A7A7A;
  --grey-40:#9C9C9C; --line:#E5E5E5; --line-2:#F0F0F0;
  --bg:#F5F5F5; --white:#fff;
  --shadow-01:0 1px 5px 0 rgba(0,0,0,.10);
  --shadow-02:0 6px 18px 0 rgba(0,0,0,.14);
  --font:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E8E8E8;font-family:var(--font);-webkit-font-smoothing:antialiased}
#viewport{width:100%;height:100vh;overflow:auto}
#canvas{width:1920px;transform-origin:top left;background:var(--white);min-height:1080px;display:flex;flex-direction:column;position:relative}

/* 顶栏 */
.navbar{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:var(--white);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.brand-name{font-size:17px;font-weight:700;letter-spacing:.04em;color:#2B2B2B}
.brand-sub{font-size:14px;color:var(--grey-60);margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}
.nav-right{display:flex;align-items:center;gap:18px}
.icon-btn{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--grey-60)}
.icon-btn:hover{background:var(--line-2)}
.dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#2E2E2E;border:1.5px solid #fff}
.user{display:flex;align-items:center;gap:8px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#A0A0A0,#3A3A3A);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.user-name{font-size:13px;color:var(--ink-2)}

/* 主体 */
.body{display:flex;flex:1;min-height:0}

/* 侧栏 */
.sidebar{width:224px;flex:0 0 224px;background:linear-gradient(180deg,#F0F0F0 0%,#F7F7F7 38%,#FFFFFF 100%);border-right:1px solid #E5E5E5;display:flex;flex-direction:column;padding:24px 0 20px;position:relative}
.profile{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
.profile .ava{width:64px;height:64px;border-radius:50%;background:linear-gradient(150deg,#CFCFCF,#9A9A9A 60%,#6A6A6A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 2px 10px rgba(0,0,0,.14);border:2px solid #fff}
.profile .hello{margin-top:12px;font-size:14px;color:var(--ink-2)}
.menu{display:flex;flex-direction:column;padding:0 12px;gap:2px}
.menu a{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:6px;font-size:14px;color:var(--ink-2);text-decoration:none;position:relative}
.menu a svg{width:17px;height:17px;flex:0 0 17px;color:var(--grey-50)}
.menu a:hover{background:rgba(0,0,0,.045)}
.menu a.active{background:var(--brand-10);color:var(--brand);font-weight:700}
.menu a.active svg{color:var(--brand)}
.menu a.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.side-foot{margin-top:auto;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.mini-screen{display:flex;align-items:center;gap:7px;background:#262626;color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.mini-screen:hover{background:#111111}
.collapse{color:var(--grey-40);cursor:pointer;line-height:0}

/* 内容 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--white)}
.tabs{height:52px;display:flex;align-items:flex-end;gap:34px;padding:0 32px;border-bottom:1px solid var(--line)}
.tab{font-size:14px;color:var(--grey-60);padding:0 2px 14px;cursor:pointer;position:relative;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--brand);font-weight:700}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}

.toolbar{display:flex;align-items:center;padding:18px 32px 6px;gap:14px}
.search{width:360px;height:36px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;padding:0 12px;gap:8px;background:var(--white)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-10)}
.search input{border:0;outline:0;flex:1;font-size:13px;color:var(--ink-2);font-family:var(--font);background:transparent}
.search input::placeholder{color:var(--grey-40)}
.search svg{color:var(--grey-40);flex:0 0 15px}
.sort-btn{height:36px;padding:0 14px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:4px;font-size:13px;color:var(--grey-60);cursor:pointer;background:#fff}
.sort-btn:hover{border-color:var(--brand-20);color:var(--brand)}
.toolbar .spacer{flex:1}
.btn-primary{height:36px;padding:0 18px;display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:0;border-radius:4px;font-size:13px;font-family:var(--font);cursor:pointer;white-space:nowrap}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary:active{background:var(--brand-click)}
.btn-primary svg{width:15px;height:15px}

/* 卡片网格 */
.grid{padding:14px 32px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-content:start}
.card{background:#fff;border:1px solid #EAEAEA;border-radius:6px;overflow:hidden;cursor:pointer;transition:box-shadow .16s,transform .16s,border-color .16s;text-decoration:none;display:block}
.card:hover{box-shadow:var(--shadow-02);border-color:rgba(0,0,0,.18);transform:translateY(-2px)}
.cover{height:0;padding-bottom:56.25%;position:relative;overflow:hidden;background:#3A3A3A}
.cover .art{position:absolute;inset:0}
.cover .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.42))}
.cover .title{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);color:#fff;font-size:15px;line-height:1.45;font-weight:700;letter-spacing:.03em;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.card-body{padding:11px 12px 12px}
.card-name{font-size:14px;font-weight:700;color:var(--ink-2);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.card-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--grey-50)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:2px;background:var(--brand-10);color:var(--brand);font-size:11px;flex:0 0 auto}
.meta-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.meta-item svg{width:12px;height:12px;color:var(--grey-40)}
.card-more{margin-left:auto;color:var(--grey-40);line-height:0;padding:2px;border-radius:2px}
.card-more:hover{background:var(--line-2);color:var(--brand)}

/* 分页 */
.pager{display:flex;align-items:center;padding:20px 32px 26px;gap:8px;border-top:1px solid var(--line-2);margin-top:18px}
.total{font-size:13px;color:var(--grey-60);margin-right:auto}
.page{min-width:28px;height:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:13px;color:var(--grey-60);cursor:pointer;border:1px solid transparent}
.page:hover{background:var(--line-2)}
.page.active{background:var(--brand);color:#fff}
.page.arrow{color:var(--grey-50)}
.ellipsis{color:var(--grey-40);padding:0 2px;font-size:13px}
.select{height:28px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--grey-60);display:inline-flex;align-items:center;gap:8px;padding:0 8px;cursor:pointer;background:#fff}
.goto{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey-50)}
.goto input{width:40px;height:28px;border:1px solid var(--line);border-radius:4px;text-align:center;font-size:12px;font-family:var(--font);color:var(--grey-60);outline:0}
.goto input:focus{border-color:var(--brand)}
.zoom-btn{position:fixed;right:18px;bottom:18px;z-index:20;background:#262626;color:#fff;border:0;border-radius:20px;padding:8px 14px;font-size:12px;font-family:var(--font);cursor:pointer;opacity:.85}
.zoom-btn:hover{opacity:1}
body.shot .zoom-btn{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="canvas">

  <div class="navbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 28 28" width="26" height="26"><path d="M7 6v16M7 14h7a4 4 0 0 0 0-8H7" fill="none" stroke="#2E2E2E" stroke-width="2.6" stroke-linecap="round"/><path d="M7 14h8" stroke="#2E2E2E" stroke-width="2.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">LINKWALL</span>
      <span class="brand-sub">课程中心</span>
    </div>
    <div class="nav-right">
      <span class="icon-btn" title="应用">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="#5C5C5C"><circle cx="4" cy="4" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="4" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="14" cy="9" r="1.6"/><circle cx="4" cy="14" r="1.6"/><circle cx="9" cy="14" r="1.6"/><circle cx="14" cy="14" r="1.6"/></svg>
      </span>
      <span class="icon-btn" title="消息">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#5C5C5C" stroke-width="1.4"><path d="M3 4.5h12v8H8l-3.5 2.5v-2.5H3z" stroke-linejoin="round"/></svg>
        <i class="dot"></i>
      </span>
      <div class="user">
        <span class="avatar">江</span>
        <span class="user-name">江天</span>
      </div>
    </div>
  </div>

  <div class="body">
    <aside class="sidebar">
      <div class="profile">
        <div class="ava">江</div>
        <div class="hello">江天</div>
      </div>
      <nav class="menu">
        <a href="#" class="active">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="13" height="11" rx="1.5"/><path d="M2.5 7h13"/></svg>
          我的课程
        </a>
        <a href="#">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="2.5"/><path d="M2.5 15c0-2.2 1.8-4 4-4s4 1.8 4 4"/><path d="M12 5.5a2.5 2.5 0 0 1 0 5M12.5 14.8c.9-1.9 3-2.8 4.5-1.8"/></svg>
          我的教学班
        </a>
        <a href="#">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="13" height="12" rx="1.5"/><path d="M2.5 7h13M6.5 3.5v-1M11.5 3.5v-1"/></svg>
          我的课表
        </a>
        <a href="#">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3h8l1.5 3v8.5H3.5V6z" stroke-linejoin="round"/><path d="M6.5 8h5M6.5 11h3.5"/></svg>
          我的任务
        </a>
        <a href="#">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5.5 12.5h7a3 3 0 0 0 .6-5.9A4.2 4.2 0 0 0 5 6.2a3.2 3.2 0 0 0 .5 6.3z" stroke-linejoin="round"/></svg>
          我的云盘
        </a>
        <a href="#">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2.5 15.5 6v6L9 15.5 2.5 12V6z" stroke-linejoin="round"/><path d="M9 8.5v4"/></svg>
          题库
        </a>
      </nav>
      <div class="side-foot">
        <div class="mini-screen">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="8.5" rx="1.2"/><path d="M6 14h4"/></svg>
          智能小屏
        </div>
        <span class="collapse" title="收起">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h10M9.5 5.5 13 9l-3.5 3.5"/></svg>
        </span>
      </div>
    </aside>

    <main class="main">
      <div class="tabs">
        <div class="tab active">我创建的</div>
        <div class="tab">我参与的</div>
        <div class="tab">所有开课记录</div>
      </div>

      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input placeholder="请输入课程名称">
        </label>
        <div class="sort-btn">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 2.5v11M4 13.5 1.8 11M4 13.5 6.2 11"/><path d="M12 2.5v11M12 2.5 9.8 4.7M12 2.5l2.2 2.2"/></svg>
          时间排序
        </div>
        <span class="spacer"></span>
        <button class="btn-primary">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
          新建课程
        </button>
      </div>

      <div class="grid" id="grid"></div>

      <div class="pager">
        <span class="total">共 80 条</span>
        <span class="page arrow">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>
        </span>
        <span class="page active">1</span>
        <span class="page">2</span>
        <span class="page">3</span>
        <span class="page">4</span>
        <span class="page">5</span>
        <span class="ellipsis">…</span>
        <span class="page">99</span>
        <span class="page arrow">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>
        </span>
        <span class="select">10条/页
          <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 4.5 3 3 3-3"/></svg>
        </span>
        <span class="goto">前往 <input value="99"> 页</span>
      </div>
    </main>
  </div>

</div></div>
<button class="zoom-btn" id="zoomBtn">1:1</button>

<script>
const courses = [
  {t:"普通统计学", tag:"课课", l:12, s:12, art:"linear-gradient(135deg,#232323 0%,#454545 45%,#6B6B6B 100%)", pat:"radial"},
  {t:"今日物理", tag:"课课", l:12, s:12, art:"linear-gradient(160deg,#1A1A1A 0%,#363636 50%,#555555 100%)", pat:"grid"},
  {t:"现代天文学", tag:"课课", l:12, s:12, art:"linear-gradient(150deg,#2E2E2E 0%,#4E4E4E 50%,#727272 100%)", pat:"leaf"},
  {t:"纳米科学前沿", tag:"课课", l:12, s:12, art:"linear-gradient(140deg,#1F1F1F 0%,#3D3D3D 55%,#616161 100%)", pat:"stone"},
  {t:"微电子学概论", tag:"课课", l:12, s:12, art:"linear-gradient(135deg,#3A3A3A 0%,#5A5A5A 50%,#7C7C7C 100%)", pat:"wood"},
  {t:"自然科学中的混沌和分形", tag:"课课", l:12, s:12, art:"linear-gradient(135deg,#262626 0%,#484848 55%,#6E6E6E 100%)", pat:"wave"},
  {t:"今日物理", tag:"课课", l:12, s:12, art:"linear-gradient(135deg,#1C1C1C 0%,#404040 50%,#666666 100%)", pat:"stripe"},
  {t:"大学化学", tag:"课课", l:12, s:12, art:"linear-gradient(140deg,#333333 0%,#555555 55%,#7A7A7A 100%)", pat:"frame"},
  {t:"自然科学中的混沌和分形", tag:"课课", l:999, s:999, art:"linear-gradient(135deg,#2A2A2A 0%,#4A4A4A 55%,#6C6C6C 100%)", pat:"wood"},
  {t:"自然科学中的混沌和分形科学", tag:"课课", l:999, s:999, art:"linear-gradient(135deg,#212121 0%,#3F3F3F 55%,#606060 100%)", pat:"grid"}
];
function artPattern(p){
  const common = "opacity:.5;";
  switch(p){
    case "radial": return `background-image:radial-gradient(circle at 30% 40%,rgba(255,255,255,.14),transparent 55%),radial-gradient(circle at 72% 68%,rgba(0,0,0,.30),transparent 60%);`;
    case "grid": return `background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 46px),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 46px);`;
    case "leaf": return `background-image:radial-gradient(ellipse at 20% 20%,rgba(255,255,255,.16),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(0,0,0,.35),transparent 60%);`;
    case "stone": return `background-image:radial-gradient(circle at 60% 30%,rgba(255,255,255,.14),transparent 45%),radial-gradient(circle at 25% 75%,rgba(0,0,0,.40),transparent 55%);`;
    case "wood": return `background-image:repeating-linear-gradient(78deg,rgba(0,0,0,.20) 0 2px,transparent 2px 13px),repeating-linear-gradient(102deg,rgba(255,255,255,.08) 0 1px,transparent 1px 22px);`;
    case "wave": return `background-image:repeating-radial-gradient(circle at 30% 60%,rgba(255,255,255,.14) 0 2px,transparent 2px 18px);`;
    case "stripe": return `background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.10) 0 3px,transparent 3px 26px);`;
    default: return `background-image:linear-gradient(90deg,transparent 12%,rgba(255,255,255,.10) 12.5%,transparent 13%),linear-gradient(0deg,transparent 24%,rgba(255,255,255,.08) 24.5%,transparent 25%),radial-gradient(circle at 78% 22%,rgba(255,255,255,.14),transparent 55%);`;
  }
}
const grid = document.getElementById('grid');
courses.forEach(c=>{
  const a = document.createElement('a');
  a.className = 'card';
  a.href = 'hi-fi-lesson-plan.html';
  a.innerHTML = `
    <div class="cover">
      <div class="art" style="background:${c.art};${artPattern(c.pat)}"></div>
      <div class="veil"></div>
      <div class="title">${c.t}</div>
    </div>
    <div class="card-body">
      <div class="card-name">${c.t}</div>
      <div class="card-meta">
        <span class="tag">${c.tag}</span>
        <span class="meta-item">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="11" height="9" rx="1"/><path d="M2.5 6.5h11"/></svg>
          课节 ${c.l}
        </span>
        <span class="meta-item">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.2"/></svg>
          开课记录 ${c.s}
        </span>
        <span class="card-more" title="更多">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>
        </span>
      </div>
    </div>`;
  grid.appendChild(a);
});

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
}));

let fit = true;
const canvas = document.getElementById('canvas');
function applyScale(){
  const w = document.getElementById('viewport').clientWidth;
  const s = fit ? Math.min(1, w / 1920) : 1;
  canvas.style.transform = `scale(${s})`;
  canvas.style.marginBottom = fit ? `-${1080*(1-s)}px` : '0';
  document.getElementById('zoomBtn').textContent = fit ? '1:1' : '适应窗口';
}
document.getElementById('zoomBtn').addEventListener('click',()=>{fit=!fit;applyScale();});
window.addEventListener('resize',applyScale);
applyScale();
if(location.hash.indexOf('shot')>=0) document.body.classList.add('shot');
</script>
</body>
</html>
